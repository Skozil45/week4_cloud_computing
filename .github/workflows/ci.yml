name: Laravel 13 CI/CD Deployment

# Tests every push to main, then deploys if they pass.
#
# Repository secrets:   SSH_HOST, SSH_USERNAME, SSH_KEY, SSH_FINGERPRINT
# Repository variables: SSH_PORT (optional, defaults to 22)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PHP_VERSION: '8.4'
  DEPLOY_PATH: /home/ourprojects-phpjermy/htdocs/phpjermy.ourprojects.my.id

jobs:
  laravel-tests:
    name: Run Tests & Build Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Locate Composer Cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-ansi --no-interaction --no-progress

      # phpunit.xml does not set APP_KEY, and the web middleware cannot encrypt without one.
      - name: Copy Environment File
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check Code Style
        run: vendor/bin/pint --test

      - name: Run Migrations & Tests
        run: |
          php artisan migrate --env=testing
          php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ''

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to Live Hosting
    needs: laravel-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Prints only pass/fail results and public host fingerprints, never the secret values.
      - name: Check Deploy Secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_FINGERPRINT: ${{ secrets.SSH_FINGERPRINT }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
        run: |
          failed=0
          for name in SSH_HOST SSH_USERNAME SSH_KEY SSH_FINGERPRINT; do
            if [ -z "${!name}" ]; then
              echo "FAIL: $name is empty"
              failed=1
            fi
          done

          key_file=$(mktemp)
          printf '%s\n' "$SSH_KEY" > "$key_file"
          if ssh-keygen -y -P '' -f "$key_file" > /dev/null 2>&1; then
            echo "OK: SSH_KEY is a valid private key"
          else
            failed=1
            case "$SSH_KEY" in
              SHA256:*) echo "FAIL: SSH_KEY holds a fingerprint, so it may be swapped with SSH_FINGERPRINT" ;;
              ssh-*) echo "FAIL: SSH_KEY holds the public key (deploy_key.pub), not the private key" ;;
              -----BEGIN*) echo "FAIL: SSH_KEY starts correctly but is incomplete or damaged ($(wc -l < "$key_file") lines, expected 7)" ;;
              *) echo "FAIL: SSH_KEY is not a private key ($(wc -l < "$key_file") lines, expected 7)" ;;
            esac
          fi
          rm -f "$key_file"

          host_keys=$(ssh-keyscan -T 10 -p "$SSH_PORT" "$SSH_HOST" 2> /dev/null | ssh-keygen -lf - 2> /dev/null | awk '{print $2, $NF}')
          echo "Host keys this runner sees:"
          echo "$host_keys"
          if [ -z "$host_keys" ]; then
            echo "FAIL: could not read host keys from SSH_HOST"
            failed=1
          elif echo "$host_keys" | grep -qF -- "$SSH_FINGERPRINT (ECDSA)"; then
            echo "OK: SSH_FINGERPRINT matches the ECDSA host key"
          elif echo "$host_keys" | grep -qF -- "$SSH_FINGERPRINT "; then
            echo "FAIL: SSH_FINGERPRINT matches a host key, but not the ECDSA one the deploy uses"
            failed=1
          else
            case "$SSH_FINGERPRINT" in
              -----BEGIN*) echo "FAIL: SSH_FINGERPRINT holds a private key, so it may be swapped with SSH_KEY" ;;
              *) echo "FAIL: SSH_FINGERPRINT does not match any host key (${#SSH_FINGERPRINT} characters, expected 50)" ;;
            esac
            failed=1
          fi

          exit "$failed"

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install Production Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-ansi --no-interaction --no-progress

      # The code ships with vendor/, so the server needs no git pull or Composer install.
      - name: Package Release
        run: tar -czf release.tar.gz app artisan bootstrap composer.json composer.lock config database public resources routes vendor

      - name: Upload Release to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: ${{ vars.SSH_PORT || 22 }}
          source: release.tar.gz
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      # .env, storage/ and SQLite files are not in the release, so the server keeps them.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          port: ${{ vars.SSH_PORT || 22 }}
          script: |
            set -e
            # deployer shares the site's group, so new files must stay group-writable for PHP.
            umask 002
            cd ${{ env.DEPLOY_PATH }}
            test -f .env
            rm -rf vendor
            # Existing folders belong to the site user, so tar must not try to change them.
            tar --no-overwrite-dir -xzf release.tar.gz
            rm -f release.tar.gz
            mkdir -p bootstrap/cache storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views
            php artisan config:clear
            php artisan migrate --force
            php artisan optimize
