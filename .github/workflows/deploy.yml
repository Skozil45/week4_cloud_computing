name: Deploy to CloudPanel

# Deploys main after CI passes, or on demand. Stays off until the repository
# variable DEPLOY_ENABLED is set to "true".
#
# Repository variables: DEPLOY_ENABLED, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH
# Repository secrets:   DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))

    env:
      # Must match the PHP version selected for the site in CloudPanel (8.4 or newer).
      PHP_BIN: php8.4
      DEPLOY_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  BatchMode yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config

      # Stops a wrong DEPLOY_PATH before anything is uploaded.
      - name: Check server
        run: ssh "$DEPLOY_TARGET" "test -f '$DEPLOY_PATH/.env'"

      # No --delete: server-only files survive, and files removed from the repo stay on the server.
      - name: Upload code
        run: |
          rsync -rlptz \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.claude/' \
            --exclude='/.user.ini' \
            --exclude='/bootstrap/cache/' \
            --exclude='/database/*.sqlite' \
            --exclude='/node_modules/' \
            --exclude='/public/.well-known/' \
            --exclude='/public/storage' \
            --exclude='/storage/' \
            --exclude='/tests/' \
            --exclude='/vendor/' \
            ./ "$DEPLOY_TARGET:$DEPLOY_PATH/"

      - name: Install and migrate
        run: |
          ssh "$DEPLOY_TARGET" "set -e
            cd '$DEPLOY_PATH'
            mkdir -p bootstrap/cache storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views
            $PHP_BIN /usr/local/bin/composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
            $PHP_BIN artisan migrate --force --no-interaction
            $PHP_BIN artisan optimize"
